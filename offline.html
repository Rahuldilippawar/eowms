<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internet जोडणी नाही</title>
<style>
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',sans-serif;background:#10162B;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:#fff;max-width:380px;width:100%;border-radius:16px;padding:36px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .icon{font-size:48px;margin-bottom:14px;}
  h1{font-size:19px;margin:0 0 10px;color:#10162B;}
  p{font-size:13.5px;color:#666B7D;line-height:1.6;margin:0 0 22px;}
  button{background:#1B8A83;color:#fff;border:none;border-radius:9px;padding:12px 26px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📡</div>
  <h1>Internet जोडणी नाही</h1>
  <p>सध्या तुमचं डिव्हाइस Internet ला जोडलेलं नाही. कृपया जोडणी तपासा आणि पुन्हा प्रयत्न करा — EOWMS ला डेटा वाचण्या/नोंदवण्यासाठी Internet आवश्यक आहे.</p>
  <button onclick="window.location.reload()">पुन्हा प्रयत्न करा</button>
</div>
</body>
</html>
