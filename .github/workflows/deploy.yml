# Hostinger वर आपोआप Deploy — main मध्ये PR merge झाला की (किंवा Actions
# tab मधून "Run workflow" दाबल्यावर) बदललेल्या Files FTP ने Upload होतात.
#
# GitHub → Settings → Secrets and variables → Actions मध्ये लागणारे Secrets:
#   FTP_SERVER    — hPanel → Files → FTP Accounts मधला FTP Hostname/IP
#   FTP_USERNAME  — FTP Username
#   FTP_PASSWORD  — FTP Password
# ऐच्छिक Variables (त्याच पानावर "Variables" tab):
#   FTP_SERVER_DIR — FTP वर App च्या Files कुठे आहेत (default: /public_html/).
#                    पूर्ण (/ ने सुरू होणारा) मार्ग द्या — "./" दिल्यास Upload
#                    Action काढलेले Folders चुकीच्या (/folder) मार्गाने काढायला
#                    जातो आणि Deploy 550 Error ने थांबतो.
#   FTP_PROTOCOL   — ftps (default) किंवा ftp

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  # PR वर फक्त तपासणी (FTP Login + Folder) — Upload नाही
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
      PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check all PHP files for syntax errors
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      # सुरक्षा-तपासणी — चुकीच्या Folder मध्ये संपूर्ण App Upload होऊ नये म्हणून,
      # आधी खात्री करतो की त्या Folder मध्ये आधीच login.php आहे.
      - name: Verify target folder already contains the app
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::FTP_SERVER / FTP_USERNAME / FTP_PASSWORD secrets are not set"
            exit 1
          fi
          # तपासणी Python (ftplib) ने — lftp/apt ची गरज नाही, म्हणजे Ubuntu package server
          # बंद असला तरी Deploy अडत नाही. FTPS Certificate नावही तपासतो (lftp सारखंच).
          python3 - <<'PY'
          import ftplib, os, socket, ssl, subprocess, sys
          host = os.environ["FTP_SERVER"].strip()
          bare = host.split("://")[-1].split("/")[0].split(":")[0]
          if bare != host: print("NOTE: FTP_SERVER secret contains extra characters (scheme, port, path or spaces) — set it to the bare host name")
          user, pw = os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"]
          d = os.environ.get("SERVER_DIR", "/public_html/").rstrip("/") or "/"
          ftps = os.environ.get("PROTOCOL", "ftps") == "ftps"
          def err(msg): print("::error::" + msg); sys.exit(1)
          if ftps:
              # Certificate कोणत्या नावासाठी आहे — माहितीसाठी छापतो
              try:
                  c0 = ssl.create_default_context(); c0.check_hostname = False; c0.verify_mode = ssl.CERT_NONE
                  f0 = ftplib.FTP_TLS(context=c0, timeout=20); f0.connect(bare, 21); f0.auth()
                  der = f0.sock.getpeercert(binary_form=True); f0.close()
                  print("FTPS certificate names:"); print(subprocess.run(["openssl", "x509", "-inform", "DER", "-noout", "-subject", "-ext", "subjectAltName"], input=der, capture_output=True).stdout.decode())
              except Exception as e:
                  print("(could not read certificate)", e)
          for attempt in (1, 2, 3):
              try:
                  if ftps:
                      f = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=30); f.connect(bare, 21); f.auth()
                      f.login(user, pw); f.prot_p()
                  else:
                      f = ftplib.FTP(timeout=30); f.connect(bare, 21); f.login(user, pw)
                  break
              except ssl.SSLCertVerificationError:
                  err("FTPS certificate does not match FTP_SERVER. Set the FTP_SERVER secret to one of the certificate names printed above (not the IP).")
              except ftplib.error_perm as e:
                  if str(e).startswith("530"): err("FTP login failed — check the FTP_USERNAME and FTP_PASSWORD secrets")
                  err("FTP error: %s" % e)
              except (OSError, EOFError, ftplib.Error) as e:
                  print("FTP connect attempt %d failed: %s" % (attempt, e))
                  if attempt == 3: err("Could not connect to the FTP server (see output above)")
          try:
              names = [n.rsplit("/", 1)[-1] for n in f.nlst(d)]
          except ftplib.error_perm:
              names = []
          f.quit()
          if "login.php" not in names:
              err("login.php not found in '%s' on the FTP server — set the FTP_SERVER_DIR variable to the folder that holds the app" % d)
          print("FTP login OK and app found in '%s'" % d)
          PY

      # Repo मधून काढलेले Folders — Upload Action ते Server वरून काढताना Folder
      # आधीच नसेल तर 550 देऊन थांबतो (मग Sync-State जतन होत नाही). म्हणून
      # Upload आधी असे Folders (रिकामे) असल्याची खात्री करतो — Action ते काढतो.
      - name: Make sure removed folders exist for the sync step
        if: github.event_name != 'pull_request'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY' || true
          import ftplib, os, ssl
          host = os.environ["FTP_SERVER"].strip().split("://")[-1].split("/")[0].split(":")[0]
          d = os.environ.get("SERVER_DIR", "/public_html/").rstrip("/") or "/"
          if os.environ.get("PROTOCOL", "ftps") == "ftps":
              f = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=30); f.connect(host, 21); f.auth(); f.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"]); f.prot_p()
          else:
              f = ftplib.FTP(timeout=30); f.connect(host, 21); f.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          f.cwd(d); print(f.pwd())
          for folder in ["teaching"]:
              try: f.mkd(folder)
              except ftplib.error_perm: pass   # आधीच आहे
          f.quit()
          PY

      - name: Upload changed files
        if: github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ env.PROTOCOL }}
          server-dir: ${{ env.SERVER_DIR }}
          # Server वरचा Data/Password कधीही बदलू नये — हे कधीच Upload होत नाहीत
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            config/**
            assets/uploads/**
            assets/audio/**
            backups/**
            update-staging/**
            docs/**
            erp/**
            storage/logs/*.log
            storage/tmp/**
            README.md
